name: Refresh Bookmaker Odds

# Odds are the one input allowed to move during the day. The AI forecast is
# frozen before kickoff by the nightly run and never changes, so this job only
# refreshes prices for fixtures about to be played and writes them straight to
# Firestore.
#
# Fetching centrally is what keeps the app to a single source of truth: every
# viewer reads the same stored odds instead of triggering their own lookup, so
# the cost is a fixed number of calls per hour no matter how many people are
# using the app.

on:
  schedule:
    - cron: '30 * * * *'
  workflow_dispatch:
    inputs:
      hours_ahead:
        description: 'Refresh fixtures kicking off within this many hours'
        required: false
        default: '48'

concurrency:
  group: refresh-odds-main
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write

jobs:
  refresh-odds:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        shell: bash
        run: |
          set -Eeuo pipefail
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --prefer-binary -r requirements.txt

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
          create_credentials_file: true
          cleanup_credentials: true

      - name: Refresh odds for upcoming fixtures
        env:
          HIGHLIGHTLY_API_KEY: ${{ secrets.HIGHLIGHTLY_API_KEY }}
          SPORTDEVS_API_KEY: ${{ secrets.SPORTDEVS_API_KEY }}
        shell: bash
        run: |
          set -Eeuo pipefail
          python scripts/refresh_match_odds.py \
            --db data.sqlite \
            --hours-ahead "${{ github.event.inputs.hours_ahead || '48' }}" \
            --push-firestore

      # data.sqlite is intentionally not committed. The nightly run owns that
      # file, and an hourly commit would race it for no benefit: odds are read
      # from Firestore and refetched on the next run anyway.
