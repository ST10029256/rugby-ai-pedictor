<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#10b981" />
    <meta name="description" content="Rugby AI Predictions - Advanced AI-powered rugby match predictions" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Rugby AI" />
    <link rel="apple-touch-icon" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="192x192" href="/icon-192.png?v=3" />
    <link rel="apple-touch-icon" sizes="512x512" href="/icon-512.png?v=3" />
    <link rel="manifest" href="/manifest.json?v=3" />
    <title>Rugby AI Predictions</title>
    <style>
      html, body, #root {
        margin: 0;
        min-height: 100%;
        height: 100%;
        background: #020617;
      }
      .boot-loader {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 32px;
        background: #020617;
        z-index: 9999;
      }
      .boot-posts {
        position: relative;
        width: 180px;
        height: 120px;
      }
      .boot-post {
        position: absolute;
        top: 0;
        width: 6px;
        height: 100%;
        border-radius: 3px;
        background: linear-gradient(180deg, #ffffff 0%, #f8f9fa 20%, #ffffff 40%, #f0f0f0 60%, #ffffff 80%, #e8e8e8 100%);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
      }
      .boot-post-left { left: calc(50% - 30px); }
      .boot-post-right { left: calc(50% + 30px); }
      .boot-crossbar {
        position: absolute;
        top: 50%;
        left: calc(50% - 30px);
        width: 66px;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #ffffff 0%, #f8f9fa 20%, #ffffff 40%, #f0f0f0 60%, #ffffff 80%, #e8e8e8 100%);
        border: 1px solid rgba(255, 255, 255, 0.9);
        box-shadow: 0 0 20px rgba(255, 255, 255, 0.8);
        z-index: 6;
      }
      .boot-ball {
        position: absolute;
        left: 50%;
        top: 50%;
        width: 30px;
        height: 19.5px;
        margin: -9.75px 0 0 -15px;
        z-index: 6;
        animation: bootKick 2s linear infinite;
      }
      .boot-ball-shape {
        width: 100%;
        height: 100%;
        border-radius: 50%;
        background: radial-gradient(ellipse at 30% 30%, #ffffff 0%, #f8f9fa 15%, #e5e7eb 30%, #d1d5db 50%, #9ca3af 70%, #6b7280 100%);
        border: 2px solid rgba(255, 255, 255, 0.3);
        box-shadow: 0 6px 12px rgba(0, 0, 0, 0.4);
      }
      .boot-label {
        color: #10b981;
        font-size: 0.875rem;
        font-weight: 500;
        letter-spacing: 0.05em;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        animation: bootPulse 2s ease-in-out infinite;
      }
      @keyframes bootKick {
        0% { transform: translate(-250%, 150%) rotate(0deg) scale(0.8); opacity: 0.7; }
        20% { transform: translate(-150%, 20%) rotate(-216deg) scale(0.95); opacity: 0.85; }
        40% { transform: translate(-50%, -60%) rotate(-432deg) scale(1.05); opacity: 1; }
        50% { transform: translate(0%, -130%) rotate(-540deg) scale(1.1); opacity: 1; }
        60% { transform: translate(50%, -150%) rotate(-648deg) scale(1.1); opacity: 1; }
        80% { transform: translate(100%, -180%) rotate(-864deg) scale(1.0); opacity: 0.9; }
        100% { transform: translate(150%, -200%) rotate(-1080deg) scale(0.8); opacity: 0.7; }
      }
      @keyframes bootPulse {
        0%, 100% { opacity: 0.6; }
        50% { opacity: 1; }
      }
    </style>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root">
      <div class="boot-loader" role="status" aria-live="polite" aria-label="Loading...">
        <div class="boot-posts">
          <div class="boot-post boot-post-left"></div>
          <div class="boot-post boot-post-right"></div>
          <div class="boot-crossbar"></div>
          <div class="boot-ball"><div class="boot-ball-shape"></div></div>
        </div>
        <div class="boot-label">Loading...</div>
      </div>
    </div>
  </body>
</html>
